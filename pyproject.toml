[project]
name = "sqed"
version = "0.1.0"
description = "Silicon cavities for colour centres and fast electrons: QNMs, 2D FEM with PML, perturbation theory, master equation"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "ngsolve"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
